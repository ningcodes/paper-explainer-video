    const F=m.F;const sp0=[(F[0]-s0.c[0])*z0+A[0],(F[1]-s0.c[1])*z0+A[1]],sp1=[(F[0]-m.c[0])*z1+A[0],(F[1]-m.c[1])*z1+A[1]];
    const z=z0*Math.pow(z1/z0,e);const sp=[lerp(sp0[0],sp1[0],e),lerp(sp0[1],sp1[1],e)];
    st={c:[F[0]-(sp[0]-A[0])/z,F[1]-(sp[1]-A[1])/z],z};}
  return st;}
// note: drift moves keep focal fixed only approximately; their declared c is the start c, so recompute end c
MOV.forEach((m,i)=>{if(i==0||i==2||i==5){const s=m.s;const F=m.F;const sp=[(F[0]-s.c[0])*s.z+A[0],(F[1]-s.c[1])*s.z+A[1]];m.c=[F[0]-(sp[0]-A[0])/m.z,F[1]-(sp[1]-A[1])/m.z];}
  if(i+1<MOV.length)MOV[i+1].s={c:m.c,z:m.z};});

function blend(col,fz){const m=col.match(/\d+/g).map(Number);const tg=[0x9F,0xAE,0xBD];return 'rgb('+m.map((v,i)=>Math.round(lerp(v,lerp(tg[i],v,0.25),fz))).join(',')+')';}
function mixRGB(col,tg,e){const m=col.match(/\d+/g).map(Number);return 'rgb('+m.map((v,i)=>Math.round(lerp(v,tg[i],e))).join(',')+')';}

function seekChrome(t){

  stepEls[1].nm.style.color=mixHex('#A89F98','#33302E',nx);
}
const av=$('av');const avImgs=[];const capt=$('capt');

}
