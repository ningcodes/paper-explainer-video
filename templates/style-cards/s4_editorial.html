/* tables */
.tbl{position:absolute;width:440px;}
.tbl .hd{position:absolute;left:0;top:0;width:440px;height:72px;}
.tbl .row{position:absolute;left:0;width:440px;height:66px;}
.cell{position:absolute;top:0;line-height:66px;font-size:30px;}
#cap{position:absolute;left:0;top:958px;width:1660px;height:92px;}

<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const C={paper:'#FFF1E5',ink:'#33302E',sec:'#66605C',rule:'#CCC1B7',claret:'#990F3D',oxford:'#0F5499',teal:'#0D7680',wheat:'#F2DFCE'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,e)=>a+(b-a)*e;
const eIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eQ=x=>{x=clamp(x);return 1-Math.pow(1-x,4);};
const p=(t,t0,d)=>clamp((t-t0)/d);
const $=id=>document.getElementById(id);
function S(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
function mixHex(a,b,e){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return 'rgb('+pa.map((v,i)=>Math.round(lerp(v,pb[i],e))).join(',')+')';}

 {t:0.12,type:'paper'},{t:1.33,type:'tick'},{t:2.05,type:'tick'},{t:3.25,type:'whoosh',d:1.1,soft:true},
 {t:4.5,type:'pop',soft:true},{t:5.2,type:'paper'},{t:5.2,type:'whoosh',d:0.6,soft:true},
 {t:7.3,type:'tick'},{t:7.8,type:'tick'},{t:8.3,type:'tick'},{t:9.3,type:'pop',soft:true},{t:9.45,type:'pop',soft:true},{t:9.6,type:'pop',soft:true},
 {t:9.8,type:'paper'},{t:9.82,type:'whoosh',d:0.6,soft:true},{t:10.95,type:'pop',soft:true},{t:11.4,type:'scratch',d:0.9},{t:12.3,type:'tick',key:true},{t:12.45,type:'pop'}
];

 d.innerHTML=`<span class="n" style="left:0">${s[0]}</span><span class="nm" style="left:36px">${s[1]}</span>`;bar.appendChild(d);slots.push(d);slotX.push(x);});
const barBase=document.createElement('div');barBase.className='a';barBase.style.cssText='left:0;top:63px;width:1920px;height:1px;background:var(--ink)';bar.appendChild(barBase);
const secU=document.createElement('div');secU.className='a';secU.style.cssText=`left:${208+36}px;top:50px;height:3px;background:var(--claret)`;bar.appendChild(secU);
const secUbg=document.createElement('div');secUbg.className='a';secUbg.style.cssText=`left:${208+36}px;top:51px;height:1px;width:${56+30}px;background:var(--rule)`;bar.insertBefore(secUbg,secU);
const glob=document.createElement('div');glob.className='a';glob.style.cssText='left:0;top:61px;height:3px;background:var(--claret)';bar.appendChild(glob);
const tc=document.createElement('div');tc.className='a num';tc.style.cssText='left:1636px;top:17px;font-size:24px;font-weight:500;color:var(--sec);width:244px;text-align:right';bar.appendChild(tc);
const fmt=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function seekBar(t){const T=348.8;glob.style.width=(1920*t/T)+'px';secU.style.width=((56+30)*t/29)+'px';tc.innerHTML=`<span style="color:var(--ink);font-weight:700">${fmt(t)}</span> / ${fmt(T)}`;}

/* ---------------- PANEL A diagram ---------------- */
const aS=$('aSvg');
const gA=S('g',{},aS);
const BX=1110,BY=310,BW=320,BH=330;
const box=S('rect',{x:BX,y:BY,width:BW,height:BH,fill:C.paper,stroke:C.ink,'stroke-width':2},gA);
const boxHd=S('rect',{x:BX,y:BY,width:BW,height:52,fill:C.wheat},gA);
const boxT=S('text',{x:BX+20,y:BY+37,'font-family':'Noto Serif CJK SC','font-weight':700,'font-size':30,fill:C.ink},gA);boxT.textContent='模型';
const boxT2=S('text',{x:BX+BW-46,y:BY+36,'text-anchor':'end','font-family':'Inter','font-weight':700,'font-size':22,'letter-spacing':'2',fill:C.sec},gA);boxT2.textContent='WEIGHTS';
const cells=[];const N=8,CS=26,CG=6,GX=BX+(BW-(N*CS+(N-1)*CG))/2,GY=BY+52+(BH-52-(N*CS+(N-1)*CG))/2;
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=rnd();const el=S('rect',{x:GX+c*(CS+CG),y:GY+r*(CS+CG),width:CS,height:CS},gA);cells.push({el,r,c,v,col:v<.5?mixHex(C.wheat,C.oxford,0.25+v*1.2):mixHex(C.wheat,C.teal,0.15+(v-.5)*1.4)});}
// lock badge
const lockG=S('g',{},gA);
S('circle',{cx:BX+BW,cy:BY,r:30,fill:C.oxford},lockG);
S('rect',{x:BX+BW-11,y:BY-4,width:22,height:17,rx:2,fill:C.paper},lockG);
S('path',{d:`M${BX+BW-7} ${BY-4} v-6 a7 7 0 0 1 14 0 v6`,fill:'none',stroke:C.paper,'stroke-width':3.5},lockG);
// callout under box
const callT=S('text',{x:BX+BW/2,y:BY+BH+52,'text-anchor':'middle','font-family':'Noto Sans CJK SC','font-weight':700,'font-size':28,fill:C.oxford},gA);callT.innerHTML='权重冻结 · <tspan font-family="Inter" font-feature-settings="tnum">0</tspan> 行改动';
// harness frame
const FX=980,FY=200,FW=580,FH=560,FCX=FX+FW/2;
const framePath=`M${FCX} ${FY} H${FX+FW} V${FY+FH} H${FX} V${FY} H${FCX}`;const PER=2*(FW+FH);
const frameBg=S('rect',{x:FX,y:FY,width:FW,height:FH,fill:C.wheat,opacity:0},gA);
gA.insertBefore(frameBg,box);
const frame=S('path',{d:framePath,fill:'none',stroke:C.claret,'stroke-width':3,'stroke-dasharray':PER,'stroke-dashoffset':PER},gA);
const PARTS=[['技能',FX+FW,330,420],['工具说明',FX+FW,560,650],['记忆',1420,FY+FH,990],['脚本',1120,FY+FH,1290],['护栏',FX,560,1630],['提示词',FX,330,1860]];
const NUMS={'提示词':1,'护栏':2,'技能':3,'工具说明':4,'脚本':5,'记忆':6};
const FR0=3.25,FRD=1.25;
function crossT(frac){let lo=0,hi=1;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(eIO(m)<frac)lo=m;else hi=m;}return FR0+lo*FRD;}
const tabs=PARTS.map(([name,x,y,d])=>{const g=S('g',{},gA);const w=name.length*28+62;const rect=S('rect',{x:x-w/2,y:y-24,width:w,height:48,fill:C.paper,stroke:C.claret,'stroke-width':1.5},g);
 S('text',{x:x-w/2+20,y:y+9,'font-family':'Inter','font-weight':800,'font-size':24,fill:C.claret},g).textContent=NUMS[name];
 S('text',{x:x-w/2+44,y:y+10,'font-family':'Noto Sans CJK SC','font-weight':500,'font-size':28,fill:C.ink},g).textContent=name;
 return {g,t:crossT(d/PER),x,y};});
const hG=S('g',{},gA);
S('rect',{x:FCX-110,y:FY-30,width:220,height:60,fill:C.claret},hG);
S('text',{x:FCX,y:FY+12,'text-anchor':'middle','font-family':'Inter','font-weight':800,'font-size':32,'letter-spacing':'5',fill:C.paper},hG).textContent='HARNESS';
const hSub=S('text',{x:FX+FW-14,y:FY+FH-18,'text-anchor':'end','font-family':'Noto Sans CJK SC','font-size':24,fill:C.claret},gA);hSub.textContent='';

function seekA(t){
  // kicker
  $('aKr').style.width=(56*eQ(p(t,-0.3,0.5)))+'px';
  wipe($('aK'),t,-0.5,0.6);
  lineRev($('aSrc'),t,0.12,0.6);
  lineRev($('aH1'),t,1.3,0.6);lineRev($('aH2'),t,1.85,0.6);
  $('aRule').style.transform=`scaleX(${eIO(p(t,2.6,0.6))})`;$('aRule').style.transformOrigin='0 0';
  lineRev($('aDek'),t,3.15,0.6);$('aHl').style.transform=`scaleX(${eIO(p(t,2.35,0.45))})`;
  $('hlU').style.transform=`scaleX(${eIO(p(t,4.45,0.45))})`;
  const nl=$('aNote').querySelectorAll('.ln');lineRev(nl[0],t,4.6,0.5);lineRev(nl[1],t,4.7,0.5);
  // diagram: box draw-in from 0
  const be=eQ(p(t,-0.6,0.7));gA.setAttribute('opacity',1);
  box.setAttribute('opacity',be);boxHd.setAttribute('opacity',be);boxT.setAttribute('opacity',be);boxT2.setAttribute('opacity',be);
  box.setAttribute('transform',`translate(0 ${(1-be)*16})`);
  cells.forEach(o=>{const st=-0.45+(o.r+o.c)*0.03;const e=eQ(p(t,st,0.4));
    // freeze sweep left->right at 1.9..2.7
    const fz=eIO(p(t,1.75+o.c*0.08,0.35));
    o.el.setAttribute('fill',fz>0?blend(o.col,fz):o.col);
    o.el.setAttribute('opacity',e);
    o.el.setAttribute('transform',`translate(0 ${(1-e)*10})`);
  });
  const le=eQ(p(t,2.45,0.4));lockG.setAttribute('opacity',le);lockG.setAttribute('transform',`translate(${BX+BW} ${BY}) scale(${0.6+0.4*le}) translate(${-(BX+BW)} ${-BY})`);
  callT.setAttribute('opacity',eQ(p(t,2.55,0.4)));callT.setAttribute('transform',`translate(0 ${(1-eQ(p(t,2.55,0.4)))*12})`);
  // frame
  frame.setAttribute('stroke-dashoffset',PER*(1-eIO(p(t,FR0,FRD))));
  frameBg.setAttribute('opacity',0.45*eQ(p(t,4.3,0.6)));
  tabs.forEach(o=>{const e=eQ(p(t,o.t-0.04,0.32));o.g.setAttribute('opacity',e);o.g.setAttribute('transform',`translate(${o.x} ${o.y}) scale(${0.85+0.15*e}) translate(${-o.x} ${-o.y})`);});
  const he=eQ(p(t,4.45,0.4));hG.setAttribute('opacity',he);hG.setAttribute('transform',`translate(0 ${(1-he)*-14})`);
  // camera push on diagram
  const cp=1+0.03*eIO(p(t,0,5.2));gA.setAttribute('transform',`translate(1270 480) scale(${cp}) translate(-1270 -480)`);
}
function blend(col,fz){const m=col.match(/\d+/g).map(Number);const tg=[0x9F,0xAE,0xBD];return 'rgb('+m.map((v,i)=>Math.round(lerp(v,lerp(tg[i],v,0.25),fz))).join(',')+')';}

/* ---------------- PANEL B tables ---------------- */
const TB=[{t:'排期',en:'SCHEDULE',cols:['场次','地点'],rows:[['第 1 场','外景'],['第 2 场','棚内'],['第 3 场','外景']],t0:7.3},

          {t:'预算',en:'BUDGET',cols:['场次','科目'],rows:[['第 1 场','场租'],['第 2 场','器材'],['第 3 场','人工']],t0:8.3}];
const TX=[120,640,1160],TY=372;const tblEls=[];
const ghosts=[];TB.forEach((d,i)=>{const gb=document.createElement('div');gb.className='a';gb.style.cssText=`left:${TX[i]-20}px;top:${TY-16}px;width:480px;height:356px;background:var(--wheat)`;$('tbls').appendChild(gb);
  const gh=document.createElement('div');gh.className='a';gh.style.cssText=`left:${TX[i]}px;top:${TY}px;width:440px;height:340px`;let gs=`<div class=a style='left:0;top:0;width:440px;height:4px;background:var(--rule)'></div><div class=a style='left:0;top:22px;width:90px;height:30px;background:var(--rule)'></div>`;for(let j=0;j<3;j++)gs+=`<div class=a style='left:0;top:${142+j*66}px;width:110px;height:22px;background:var(--rule)'></div><div class=a style='left:200px;top:${142+j*66}px;width:${80+((i*3+j)*37)%90}px;height:22px;background:var(--rule)'></div>`;gh.innerHTML=gs;$('tbls').appendChild(gh);ghosts.push({gb,gh,i});});
TB.forEach((d,i)=>{const w=document.createElement('div');w.className='tbl';w.style.left=TX[i]+'px';w.style.top=TY+'px';w.style.height='340px';
  let h=`<div class="hd"><div class="a" style="left:0;top:0;height:4px;width:440px;background:var(--ink)" data-r></div>
