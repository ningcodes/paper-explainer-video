<script>
const NS='http://www.w3.org/2000/svg';
const INK='#1E1E1E', RED='#E03131', Y='#FFEC99', B='#A5D8FF', G='#B2F2BB', P='#FFC9C9', V='#D0BFFF', GREY='#6B665C';
const WK="'LXGW WenKai'", CV="'Caveat','LXGW WenKai'";
function mul(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mul(20261020); const rr=(a,b)=>a+(b-a)*rnd();
const f=v=>Math.round(v*10)/10;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const E_={
 lin:x=>x, out:x=>1-Math.pow(1-x,3), inout:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 pen:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, sine:x=>-(Math.cos(Math.PI*x)-1)/2,
 back:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}
};
function E(tag,a,par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(par)par.appendChild(e);return e;}

/* ---------- rough geometry ---------- */
function seg(x1,y1,x2,y2,r=1.5){
 const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
 const rf=r*Math.min(1.5,.45+L/320), j=()=>rr(-rf,rf);
 const bow=rr(-1,1)*Math.min(L*.012,5);
 return `M${f(x1+j())} ${f(y1+j())}C${f(x1+dx*.3+nx*bow+j())} ${f(y1+dy*.3+ny*bow+j())} ${f(x1+dx*.7+nx*bow+j())} ${f(y1+dy*.7+ny*bow+j())} ${f(x2+j())} ${f(y2+j())}`;
}
const line2=(x1,y1,x2,y2,r)=>[seg(x1,y1,x2,y2,r),seg(x1,y1,x2,y2,r)];
function rectD(x,y,w,h,r=1.6){const Pt=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],o=[];for(let k=0;k<2;k++)for(let i=0;i<4;i++){const p=Pt[i],q=Pt[(i+1)%4];o.push(seg(p[0],p[1],q[0],q[1],r));}return o;}
function cr(P){let d=`M${f(P[0][0])} ${f(P[0][1])}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;}return d;}
function ellD(cx,cy,rx,ry,r=1.5,passes=2,over=.4,th=null){const o=[];for(let k=0;k<passes;k++){const t0=th!==null?th+rr(-.15,.15):rr(0,6.28),tot=6.283+rr(over*.4,over),n=Math.max(10,Math.round((rx+ry)/16)),P=[];
 for(let i=0;i<=n;i++){const a=t0+tot*i/n,s=1+rr(-.012,.012)+(k?.012:0);P.push([cx+Math.cos(a)*rx*s+rr(-r,r),cy+Math.sin(a)*ry*s+rr(-r,r)]);}o.push(cr(P));}return o;}
function curveD(P,r=1.5){return cr(P.map((p,i)=>(i==0||i==P.length-1)?p:[p[0]+rr(-r,r),p[1]+rr(-r,r)]));}
function headD(P,len=24,ang=.5){const a=P[P.length-1],b=P[P.length-2],th=Math.atan2(a[1]-b[1],a[0]-b[0]);
 return [seg(a[0],a[1],a[0]-Math.cos(th-ang)*len,a[1]-Math.sin(th-ang)*len,1),seg(a[0],a[1],a[0]-Math.cos(th+ang)*len,a[1]-Math.sin(th+ang)*len,1)];}
function hachRect(x,y,w,h,gap=11,r=1){const o=[];let fl=false;for(let c=gap*.6;c<w+h;c+=gap){const u1=Math.max(0,c-h),u2=Math.min(w,c);let p=[x+u1,y+(c-u1)],q=[x+u2,y+(c-u2)];if(fl)[p,q]=[q,p];fl=!fl;o.push(seg(p[0],p[1],q[0],q[1],r));}return o;}
function blobRect(x,y,w,h,j=3){const P=[];const n=6;for(let i=0;i<n;i++)P.push([x+w*i/(n-1)+rr(-j,j),y+rr(-j,j)]);for(let i=1;i<4;i++)P.push([x+w+rr(-j,j),y+h*i/4+rr(-j,j)]);for(let i=n-1;i>=0;i--)P.push([x+w*i/(n-1)+rr(-j,j),y+h+rr(-j,j)]);for(let i=3;i>0;i--)P.push([x+rr(-j,j),y+h*i/4+rr(-j,j)]);return 'M'+P.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z';}

/* ---------- registry ---------- */
const items=[]; let clipN=0;
function draw(par,ds,t0,dur,o={}){
 const g=E('g',{},par); const segs=[]; let tot=0;
 for(const d of ds){const el=E('path',{d,fill:'none',stroke:o.c||INK,'stroke-width':o.w||3.4,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  if(o.op)el.setAttribute('opacity',o.op); if(o.blend)el.style.mixBlendMode=o.blend;
  const L=el.getTotalLength(); const S=[];for(let i=0;i<=16;i++){const p=el.getPointAtLength(L*i/16);S.push([p.x,p.y]);}
  el.setAttribute('pathLength','1');el.setAttribute('stroke-dasharray','1 2');
  segs.push({el,len:L,c0:tot,S});tot+=L;}
 const it={k:'draw',g,segs,tot,t0,dur,pen:o.pen!==false,ease:E_[o.ease||'pen'],last:-1};items.push(it);return it;
}
function txt(par,x,y,s,o={}){const t=E('text',{x,y,'font-family':o.fam||WK,'font-size':o.size||32,'font-weight':o.wt||400,fill:o.c||INK,'text-anchor':o.anchor||'start'},par);
 if(o.ls)t.setAttribute('letter-spacing',o.ls);
 if(Array.isArray(s)){for(const [str,col,fam,sz] of s){const ts=E('tspan',{fill:col||o.c||INK},t);if(fam)ts.setAttribute('font-family',fam);if(sz)ts.setAttribute('font-size',sz);ts.textContent=str;}}else t.textContent=s;return t;}
function wipeGroup(par,t0,dur,o={}){const id='cp'+(clipN++);const cp=E('clipPath',{id,clipPathUnits:'userSpaceOnUse'},document.querySelector('#board defs'));const rc=E('path',{d:'M0 0Z'},cp);
 const g=E('g',{'clip-path':`url(#${id})`},par);const it={k:'wipe',g,rc,t0,dur,dir:o.dir||'right',pen:!!o.pen,ease:E_[o.ease||'pen'],pad:o.pad||14};items.push(it);return it;}
function finishWipe(it){const b=it.g.getBBox();it.b=b;}
function write(par,x,y,s,o,t0,dur){const it=wipeGroup(par,t0,dur,{pen:o.pen!==false,ease:'lin'});it.text=txt(it.g,x,y,s,o);finishWipe(it);return it;}
function fill(par,d,col,t0,dur,o={}){const it=wipeGroup(par,t0,dur,{dir:o.dir||'right',pen:false,ease:'out'});const el=E('path',{d,fill:col},it.g);if(o.op)el.setAttribute('opacity',o.op);finishWipe(it);return it;}
function pop(par,cx,cy,rot,t0,dur=.34,o={}){const g=E('g',{},par);const it={k:'pop',g,cx,cy,rot,t0,dur,from:o.from||1.45,spin:o.spin===undefined?7:o.spin};items.push(it);return it;}

/* ---------- build the board ---------- */
function sticky(par,cx,cy,w,h,col,rot,t0,o={}){
 const it=pop(par,cx,cy,rot,t0,o.dur||.36,o);const g=it.g;
 const x=cx-w/2,y=cy-h/2;
 E('path',{d:blobRect(x+8,y+12,w,h,2),fill:'#5A4A2A',opacity:.22,filter:'url(#sh)'},g);
 E('path',{d:`M${x} ${y}L${x+w} ${y+2}L${x+w-2} ${y+h-10}Q${x+w-14} ${y+h+2} ${x+w-34} ${y+h}L${x+1} ${y+h-1}Z`,fill:col},g);
 E('path',{d:`M${x} ${y}L${x+w} ${y+2}L${x+w} ${y+16}L${x} ${y+14}Z`,fill:'#000',opacity:.04},g);
 return g;
}
function build(){
 const W=document.getElementById('world');
 const L1=E('g',{},W), L2=E('g',{},W), L3=E('g',{},W); // under / mid / top

 /* ===== A: paper page doodle + sticky ===== */
 fill(L1,blobRect(70,150,280,360,2),'#FFFFFF',-.3,.3);
 draw(L1,[...rectD(64,144,292,372,1.4),seg(306,144,356,194,1),seg(306,144,306,194,1),seg(306,194,356,194,1)],-.3,.5,{w:3,pen:false});
 const sl=[];for(let k=0;k<9;k++){const y0=340+k*20,x0=96,wl=k%4==3?120:200*rr(.8,1);const Pp=[];for(let q=0;q<=8;q++)Pp.push([x0+wl*q/8,y0+(q%2?-3:3)]);sl.push(cr(Pp));}
 draw(L1,sl,.1,.7,{w:2.2,c:'#868E96',pen:false,ease:'lin'});
 write(L1,96,410-150+40,'arXiv',{fam:CV,size:44,wt:700,c:'#868E96',pen:false},-.2,.3);
 const sA=sticky(L2,410,250,390,196,Y,-4,-.12);
 txt(sA,410,250,'Google 新论文',{size:58,wt:700,anchor:'middle'});
 txt(sA,410,305,'云 AI 团队 × 西北大学',{size:30,anchor:'middle',c:'#5C5440'});
 draw(sA,line2(268,266,548,266,1.2),.45,.32,{c:RED,w:5,op:.85});

 /* ===== A: model box ===== */
 const M=[960,560];
 fill(L1,blobRect(806,436,308,248,4),B,1.46,.32);
 draw(L2,rectD(800,430,320,260,1.8),1.30,.48);
 write(L2,960,492,'模型',{size:48,wt:700,anchor:'middle'},1.52,.3);
 // weight grid 6x3
 const gx=852,gy=520,cs=36,cols=6,rows=3; const grid=[];
 for(let i=0;i<=rows;i++)grid.push(seg(gx,gy+i*cs,gx+cols*cs,gy+i*cs,1));
 for(let j=0;j<=cols;j++)grid.push(seg(gx+j*cs,gy,gx+j*cs,gy+rows*cs,1));
 draw(L2,grid,1.78,.42,{w:2.2});
 const cellC=['#FFFFFF','#74C0FC','#FFFFFF','#D0BFFF','#FFFFFF','#74C0FC','#FFEC99','#FFFFFF','#74C0FC','#FFFFFF','#D0BFFF','#FFFFFF','#FFFFFF','#74C0FC','#FFFFFF','#FFEC99','#74C0FC','#FFFFFF'];
 for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const k=i*cols+j;fill(L1,blobRect(gx+j*cs+3,gy+i*cs+3,cs-6,cs-6,1.5),cellC[k],1.95+((i+j)%6)*.035,.12,{op:.95});}
 // padlock at top-right corner
 const lk=E('g',{},L3);
 fill(lk,blobRect(1092,412,64,52,2),Y,2.22,.18);
 draw(lk,[curveD([[1102,414],[1100,388],[1124,374],[1148,388],[1146,414]],1)],2.12,.2,{w:3.6});
 draw(lk,rectD(1090,410,68,56,1.2),2.24,.24,{w:3.4});
 draw(lk,[...ellD(1124,434,6,6,.6,1,.3),seg(1124,440,1124,452,.6)],2.42,.12,{w:3});
 // frozen note
 write(L2,960,762,['权重 ',['0',RED],' 改动'].map(x=>Array.isArray(x)?x:[x,RED]),{size:40,wt:700,anchor:'middle',c:RED},2.42,.36);
 draw(L2,[curveD([[870,778],[960,784],[1052,776]],1.2),curveD([[880,786],[965,790],[1045,783]],1.2)],2.80,.22,{c:RED,w:4.5});

 /* ===== A: Harness ring ===== */
 const rx=392,ry=292;
 const band=E('g',{},L1);
 draw(band,[cr(Array.from({length:41},(_,i)=>{const a=-Math.PI/2+i/40*Math.PI*2*1.02;return[M[0]+Math.cos(a)*rx,M[1]+Math.sin(a)*ry];}))],3.28,.95,{c:V,w:46,op:.55,pen:false,ease:'inout'});
 const dashes=[];const ND=40;for(let i=0;i<ND;i++){const a0=-Math.PI/2+i/ND*Math.PI*2,a1=a0+Math.PI*2/ND*.58;const P=[];for(let k=0;k<4;k++){const a=a0+(a1-a0)*k/3;P.push([M[0]+Math.cos(a)*rx+rr(-1.6,1.6),M[1]+Math.sin(a)*ry+rr(-1.6,1.6)]);}dashes.push(cr(P));}
 draw(L2,dashes,3.30,.95,{w:3.8,ease:'inout'});
 const labs=[['提示词',Y],['护栏',P],['技能',G],['工具说明',B],['脚本',V],['记忆',Y]];
 labs.forEach(([s,c],i)=>{const a=-Math.PI/2+i*Math.PI/3;const x=M[0]+Math.cos(a)*rx,y=M[1]+Math.sin(a)*ry;
  const w=s.length*32+40,h=56;const it=pop(L3,x,y,rr(-5,5),3.5+i*.13,.32,{from:1.6});
  E('path',{d:blobRect(x-w/2+4,y-h/2+6,w,h,2),fill:'#5A4A2A',opacity:.18,filter:'url(#sh)'},it.g);
  E('path',{d:blobRect(x-w/2,y-h/2,w,h,2.5),fill:c},it.g);
  for(const d of rectD(x-w/2,y-h/2,w,h,1.2))E('path',{d,fill:'none',stroke:INK,'stroke-width':2.4,'stroke-linecap':'round'},it.g);
  txt(it.g,x,y+11,s,{size:31,wt:700,anchor:'middle'});
 });
 write(L3,1262,292,'Harness',{fam:CV,size:132,wt:700},4.42,.5);
 draw(L3,[curveD([[1262,312],[1420,318],[1606,306]],1.4),curveD([[1276,322],[1440,326],[1590,316]],1.4)],4.88,.2,{c:RED,w:5.5});
 const arP=[[1300,330],[1262,362],[1236,384]];
 draw(L3,[curveD(arP,1),...headD(arP,20)],4.7,.2,{w:3.2});

 /* ===== B: real task ===== */
 const sB=sticky(L3,2300,212,340,112,P,3,5.42);
 txt(sB,2300,228,'真实职场任务',{size:46,wt:700,anchor:'middle'});
 write(L2,2502,206,'JobBench · 制片人对账',{size:38,wt:700},5.78,.62);
 write(L2,2504,250,'（论文里的真实任务）',{size:28,c:GREY},6.2,.4);
 // clapperboard doodle
 const cb=E('g',{},L2);
 fill(cb,blobRect(3040,196,140,84,2),'#E9ECEF',6.45,.2);
 draw(cb,[...rectD(3036,192,148,92,1.2)],6.36,.26,{w:3.2});
 draw(cb,[...rectD(3030,160,156,30,1),seg(3060,160,3075,190,.8),seg(3095,160,3110,190,.8),seg(3130,160,3145,190,.8),seg(3165,160,3180,190,.8)],6.55,.28,{w:3});
 // three tables
 const T=[[2250,'排期',B,7.05],[2650,'人员',G,7.48],[3050,'预算',P,7.92]];
 const ty=322,tw=320,th=272,hh=60;
 T.forEach(([cx,s,c,t0],ti)=>{const x=cx-tw/2;const tf=5.95+ti*.2;
  fill(L1,blobRect(x+4,ty+4,tw-8,hh-6,2),c,t0,.24);
  draw(L2,rectD(x,ty,tw,th,1.8),tf,.34,{w:3.4});
  write(L2,cx,ty+44,s,{size:40,wt:700,anchor:'middle'},t0+.08,.22);
  const gl=[seg(x,ty+hh,x+tw,ty+hh,1),seg(x,ty+hh+71,x+tw,ty+hh+71,1),seg(x,ty+hh+142,x+tw,ty+hh+142,1),seg(x+104,ty+hh,x+104,ty+th,1),seg(x+212,ty+hh,x+212,ty+th,1)];
  draw(L2,gl,tf+.42,.3,{w:2.2});
  const sc=[];for(let r=0;r<3;r++)for(let k=0;k<3;k++){const x0=x+[16,120,228][k],y0=ty+hh+36+r*71,wl=[60,64,62][k]*rr(.7,1);const Pp=[];for(let q=0;q<=6;q++)Pp.push([x0+wl*q/6,y0+(q%2?-5:5)*rr(.6,1)]);sc.push(cr(Pp));}
  draw(L2,sc,t0+.3,.34,{w:2.4,c:'#495057'});
 });
 // reconcile band + checks
 draw(L1,[curveD([[2094,ty+hh+106],[2650,ty+hh+102],[3206,ty+hh+107]],1.5)],8.48,.36,{c:'#FFD43B',w:46,op:.55,pen:false,ease:'inout'});
 T.forEach(([cx],i)=>{const x=cx+tw/2-34,y=ty+hh+104;draw(L3,[curveD([[x-12,y],[x-2,y+12],[x+20,y-16]],.6)],8.72+i*.09,.12,{c:'#2B8A3E',w:5});});
 const tgt=[[2250,604,2560,740],[2650,604,2650,730],[3050,604,2740,740]];
 tgt.forEach(([a,b,c,d],i)=>{const P2=[[a,b+6],[(a+c)/2+(i-1)*-30,(b+d)/2+6],[c,d]];draw(L2,[curveD(P2,1),...headD(P2,20)],8.84+i*.06,.24,{w:3.2});});
 fill(L1,blobRect(2496,744,308,84,3),G,9.12,.24);
 draw(L2,rectD(2490,740,320,92,1.6),9.0,.3);
 write(L2,2650,802,'对上账 ✓',{size:50,wt:700,anchor:'middle'},9.2,.3);
 draw(L3,ellD(2650,786,232,78,2,2,.35,-2.2),9.46,.34,{c:RED,w:4.6});

 /* ===== C: score ===== */
 const C0=E('g',{transform:'translate(-450 0)'},W);const L2c=E('g',{},C0),L3c=E('g',{},C0),L1c=E('g',{},C0);C0.insertBefore(L1c,L2c);
 const yv=v=>1620-v*5.3;
 write(L2c,1250,1030,'事后打分',{size:54,wt:700},10.08,.4);
 write(L2c,1475,1030,'JobBench 制片人任务',{size:28,c:GREY},10.3,.4);
 fill(L1c,ellD(1390,1668,50,48,1,1,.1)[0]+'Z',P,10.36,.2);
 draw(L2c,[...rectD(1336,1062,108,570,1.6)],10.14,.42);
 draw(L2c,ellD(1390,1668,54,50,1.4,2,.3,-1.0),10.3,.22);
 const tk=[];for(let v=0;v<=100;v+=20)tk.push(seg(1444,yv(v),1468,yv(v),.7));draw(L2c,tk,10.5,.2,{w:2.4});
 [[0,'0'],[50,'50'],[100,'100']].forEach(([v,s],i)=>write(L2c,1478,yv(v)+11,s,{fam:CV,size:36,wt:700,c:GREY,pen:false},10.55+i*.05,.12));
 // 43 fill (hatched grey)
 const hz=E('g',{},L2c);
 const cpi='cpT';const cpe=E('clipPath',{id:cpi},document.querySelector('#board defs'));E('rect',{x:1340,y:1066,width:100,height:600},cpe);hz.setAttribute('clip-path',`url(#${cpi})`);
 fill(hz,blobRect(1342,yv(43),96,1620-yv(43)+40,2),'#DEE2E6',10.72,.3,{dir:'up'});
 draw(hz,hachRect(1340,yv(43),100,1620-yv(43)+30,12,1),10.74,.34,{w:1.8,c:'#868E96',pen:false,ease:'lin'});
