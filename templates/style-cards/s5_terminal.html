<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>S5 Terminal Launch</title>
<link rel="stylesheet" href="../kit/fonts/fontsource-jetbrains-mono-5.3.0/400.css">
<link rel="stylesheet" href="../kit/fonts/fontsource-jetbrains-mono-5.3.0/500.css">
<link rel="stylesheet" href="../kit/fonts/fontsource-jetbrains-mono-5.3.0/700.css">
<style>
:root{
  --bg:#0A0A0B; --grid:#16161A; --panel:#111114; --line:#26262C;
  --tx:#EDEDED; --mu:#8A8A93; --dim:#55555D;
  --g:#3DF5A6; --c:#4CC9F0; --a:#FFB547; --m:#FF4FD8; --r:#FF5C6C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:'Noto Sans CJK SC',sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
.disp{font-family:'Inter Display','Inter',sans-serif;font-weight:700}
.abs{position:absolute}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#bg{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px 15px}
#glow{position:absolute;left:0;top:0;width:1920px;height:1080px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(5,5,6,.85) 100%)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 30px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.4)}
.tb{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--mu);background:rgba(255,255,255,.015);border-radius:12px 12px 0 0}
.dot{width:12px;height:12px;border-radius:50%;background:#2E2E35}
.tb .ttl{flex:1;text-align:center;margin-right:52px}
.code{font-family:'JetBrains Mono',monospace;font-size:30px;line-height:48px;white-space:pre}
.cur{display:inline-block;width:.6em;height:1.05em;vertical-align:-.17em;background:var(--g);box-shadow:0 0 12px rgba(61,245,166,.6)}
.c-g{color:var(--g)} .c-c{color:var(--c)} .c-a{color:var(--a)} .c-m{color:var(--m)} .c-mu{color:var(--mu)} .c-d{color:var(--dim)} .c-t{color:var(--tx)} .c-r{color:var(--r)}
/* top bar */
#bar{position:absolute;left:0;top:0;width:1920px;height:64px;background:linear-gradient(#0E0E11,#0B0B0D);border-bottom:1px solid #1E1E23}
.tab{position:absolute;top:11px;height:42px;border-radius:8px;border:1px solid #202026;background:#0F0F12;overflow:hidden;
  font-family:'JetBrains Mono',monospace;font-size:22px;color:#5C5C66;display:flex;align-items:center;padding:0 14px;gap:10px;white-space:nowrap}
.tab .n{color:#4A4A52}
.tab.on{border-color:rgba(61,245,166,.55);color:var(--tx);font-size:26px;
  box-shadow:0 0 0 1px rgba(61,245,166,.12),0 0 18px rgba(61,245,166,.18),0 0 2px rgba(61,245,166,.5) inset}
.tab.on .n{color:var(--g)}
.tab .zh{font-family:'Noto Sans CJK SC';font-weight:500}
#tabfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(61,245,166,.02),rgba(61,245,166,.10))}#tabline{position:absolute;left:0;bottom:0;height:3px;background:var(--g);box-shadow:0 0 10px var(--g);border-radius:0 2px 2px 0}
#gprog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--g);box-shadow:0 0 8px var(--g)}
/* subtitle */
#sub{position:absolute;top:966px;left:0;width:1640px;display:flex;justify-content:center}
#subp{display:flex;align-items:center;gap:18px;padding:10px 34px 12px 26px;border-radius:14px;background:rgba(14,14,17,.86);
  border:1px solid #2C2C33;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.5);font-size:44px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
#subp .pr{font-family:'JetBrains Mono';font-weight:700;color:var(--g);font-size:36px}
#subp .hl{font-family:'JetBrains Mono';font-weight:700}
/* chips */
.chip{position:absolute;width:300px;height:104px;border-radius:12px;background:#111114;border:1px solid var(--line);padding:14px 20px 0 52px}
.chip .zh{font-size:32px;font-weight:700;line-height:40px}
.chip .fn{font-family:'JetBrains Mono';font-size:24px;color:var(--mu);line-height:34px}
.chip .led{position:absolute;left:22px;top:26px;width:12px;height:12px;border-radius:50%}
/* tables */
.tbl{position:absolute;left:0;top:44px;width:100%}
.row{display:flex;height:72px;align-items:center;border-bottom:1px solid #1C1C21;padding:0 24px;position:relative}
.row.h{height:58px;font-size:28px;color:var(--mu);font-weight:500}
.cell{font-family:'JetBrains Mono';font-size:31px;position:relative;white-space:nowrap}
.cell .bgc{position:absolute;left:-10px;right:-10px;top:-6px;bottom:-6px;border-radius:6px}
.tag{font-family:'Noto Sans CJK SC';font-weight:700;font-size:28px;color:var(--tx);padding:0 12px;border-radius:6px;border:1px solid #30303A;line-height:36px;margin-left:auto}
#slices div{position:absolute;left:0;width:1920px}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
</style>
</head>
<body>
<div id="root">
  <div id="bg"></div>
  <canvas id="glow" width="1920" height="1080"></canvas>
  <div id="stage"></div>
  <div id="vig"></div>
  <div id="scan"></div>
  <div id="slices"></div>
  <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0"></div>
  <div id="sub"><div id="subp"></div></div>
  <div id="plinth" class="abs" style="left:1650px;top:1050px;width:282px;height:40px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(61,245,166,.28),rgba(61,245,166,0) 70%)"></div>
  <div class="abs" style="left:1672px;top:1077px;width:238px;height:1px;background:linear-gradient(90deg,transparent,rgba(61,245,166,.7),transparent)"></div>
  <canvas id="av" width="242" height="220" style="position:absolute;left:1670px;top:860px"></canvas>
  <div id="bar"></div>
</div>
<script>
'use strict';
// ---------- utils ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,e)=>a+(b-a)*e;
const P=(t,a,d)=>clamp((t-a)/d);
const eo=x=>1-Math.pow(1-clamp(x),3);
const eo5=x=>1-Math.pow(1-clamp(x),5);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=(x,s=1.6)=>{x=clamp(x);const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const $=id=>document.getElementById(id);
const ST=$('stage');
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;ST.appendChild(e);return e}
function show(e,o,tf){e.style.opacity=o;e.style.visibility=o<=0.001?'hidden':'visible';if(tf!==undefined)e.style.transform=tf}
function pop(t,a,d=.42){const k=P(t,a,d);return{o:clamp(k*3),s:lerp(.9,1,eb(k)),y:lerp(24,0,eo(k))}}
function hexmix(c1,c2,k){const h=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));const A=h(c1),B=h(c2);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')+')'}
// typed code line: segs [[text,cls]], n chars
function typed(segs,n,cursor){let out='',left=n;for(const[s,c]of segs){if(left<=0)break;const p=s.slice(0,left);left-=p.length;out+=`<span class="${c}">${esc(p)}</span>`}if(cursor)out+='<span class="cur"></span>';return out}
const segLen=segs=>segs.reduce((a,s)=>a+s[0].length,0);
const blink=t=>Math.floor(t*2.4)%2===0;

window.DURATION=13.6;
const CUTS=[1.25,5.28,9.95];

// ---------- top bar ----------
const SECS=['钩子','背景','核心思路','走一遍例子','自进化','结果','冷水','收获'];
const BAR=$('bar');
(function(){
  let x=20;const widths=[300,190,236,276,214,180,180,180];const gap=8;
  const tot=widths.reduce((a,b)=>a+b,0)+gap*7;const sc=(1920-40)/tot;
  SECS.forEach((n,i)=>{const w=widths[i]*sc;const d=document.createElement('div');d.className='tab'+(i===0?' on':'');d.style.left=x+'px';d.style.width=w+'px';
    d.innerHTML=(i===0?'<div id="tabfill"></div><div id="tabline"></div>':'')+`<span class="n" style="position:relative">${String(i+1).padStart(2,'0')}</span><span class="zh" style="position:relative">${n}</span>`+(i===0?'<span id="tc" style="position:relative;margin-left:auto;font-size:20px;color:#8A8A93">00:00</span>':'');
    BAR.appendChild(d);x+=w+gap});
  const g=document.createElement('div');g.id='gprog';BAR.appendChild(g);
})();
function drawBar(t){
  $('tabfill').style.width=(clamp(t/29)*100)+'%';$('tabline').style.width=(clamp(t/29)*100)+'%';
  $('gprog').style.width=(1920*t/348.8)+'px';
  const s=Math.floor(t);$('tc').textContent='00:'+String(s).padStart(2,'0')+' / 00:29';
}

// ---------- background glow (canvas, cheap) ----------
const GC=$('glow').getContext('2d');
function drawGlow(t){
  GC.clearRect(0,0,1920,1080);
  // scene-dependent focus point and colour
  let x=960,y=520,col=[76,201,240],a=.13,r=820;
  if(t>=1.25&&t<3.2){x=600;y=450;col=[76,201,240]}
  else if(t>=3.2&&t<5.28){x=lerp(600,820,eio(P(t,3.2,.55)));y=lerp(450,520,eio(P(t,3.2,.55)));col=[61,245,166];a=.11+.05*eo(P(t,4.45,.4))}
  else if(t>=5.28&&t<9.95){x=820;y=520;col=[76,201,240];a=.09+.05*eo(P(t,9.25,.4))}
  else if(t>=9.95){x=1090;y=470;const k=P(t,11.55,.6);col=[Math.round(lerp(255,61,k)),Math.round(lerp(181,245,k)),Math.round(lerp(71,166,k))];a=.10+.06*eo(P(t,12.15,.3))}
  const g=GC.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.45,`rgba(${col},${a*.35})`);g.addColorStop(1,`rgba(${col},0)`);
  GC.fillStyle=g;GC.fillRect(0,0,1920,1080);
}

// ======================= SCENE 1 : cat paper.txt =======================
const s1term=el(`<div class="panel" style="left:400px;top:150px;width:1120px;height:292px">
 <div class="tb"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="ttl">zsh — ~/papers</span></div>
 <div id="s1code" class="code" style="padding:20px 32px"></div></div>`);
const S1L=[
 [['~/papers','c-c'],[' ❯ ','c-g'],['cat paper.txt','c-t']],
 [['title   ','c-mu'],['Harness²','c-t']],
 [['from    ','c-mu'],['Google Cloud AI','c-c'],[' × ','c-mu'],['Northwestern','c-t']],
 [['status  ','c-mu'],['● new paper','c-g']],
];
const s1head=el(`<div class="abs" style="left:0;top:500px;width:1920px;text-align:center;white-space:nowrap">
 <span id="h1a" class="disp" style="display:inline-block;font-size:168px;letter-spacing:-.045em;line-height:1">Google</span><span style="display:inline-block;width:40px"></span><span id="h1b" style="display:inline-block;font-size:156px;font-weight:700;letter-spacing:-.02em;line-height:1">新论文</span>
 <div id="h1u" style="margin:34px auto 0;height:2px;width:760px;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 16px rgba(61,245,166,.7)"></div>
 <div id="h1s" class="mono" style="margin-top:26px;font-size:30px;color:var(--mu);letter-spacing:.06em">Google Cloud AI <span class="c-d">×</span> Northwestern <span class="c-d">·</span> <span class="c-g">Harness²</span></div>
</div>`);
function scene1(t){
  const on=t<1.25;show(s1term,on?1:0);show(s1head,on?1:0);if(!on)return;
  const k=eo(P(t,0,.35));s1term.style.transform=`translateY(${lerp(14,0,k)}px) scale(${lerp(.975,1,k)})`;
  // typing
  const n0=segLen(S1L[0]);const n=Math.floor(clamp((t-0.06)/0.42)*n0);
  let h='';const outT=[.6,.7,.8];
  const typingDone=t>=0.5;
  h+=typed(S1L[0],typingDone?n0:n,!typingDone||t<.6)+'\n';
  for(let i=1;i<4;i++){const k2=P(t,outT[i-1],.12);if(k2>0)h+=`<span style="opacity:${k2}">${typed(S1L[i],Math.ceil(segLen(S1L[i])*k2*1.0),false)}</span>`;h+='\n'}
  if(t>=0.9&&blink(t))h=h.replace(/\n$/,'<span class="cur"></span>\n');
  $('s1code').innerHTML=h;
  const a=pop(t,.15,.45),b=pop(t,.42,.45);
  $('h1a').style.opacity=a.o;$('h1a').style.transform=`translateY(${a.y*2}px) scale(${a.s})`;
  $('h1b').style.opacity=b.o;$('h1b').style.transform=`translateY(${b.y*2}px) scale(${b.s})`;
  const u=eo5(P(t,.55,.45));$('h1u').style.width=(760*u)+'px';$('h1u').style.opacity=u;
  const sk=P(t,.75,.25);$('h1s').style.opacity=sk;$('h1s').style.transform=`translateY(${lerp(10,0,eo(sk))}px)`;
}

// ======================= SCENE 2/3 : frozen model → harness =======================
const GR={cols:16,rows:9,cs:36,gap:6};
let cellsHtml='';const R=rng(7);const CV=[];
for(let j=0;j<GR.rows;j++)for(let i=0;i<GR.cols;i++){const v=R();CV.push(v);cellsHtml+=`<div class="abs wc" style="left:${i*(GR.cs+GR.gap)}px;top:${j*(GR.cs+GR.gap)}px;width:${GR.cs}px;height:${GR.cs}px;border-radius:5px"></div>`}
const model=el(`<div class="panel" style="left:200px;top:150px;width:760px;height:600px;transform-origin:50% 50%">
 <div class="tb"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="ttl" style="margin-right:0">base_model / weights.safetensors</span><span id="frz" class="mono" style="font-size:18px;color:var(--c);border:1px solid rgba(76,201,240,.5);padding:2px 10px;border-radius:999px">FROZEN</span></div>
 <div class="mono" style="position:absolute;left:44px;top:62px;font-size:24px;color:var(--mu)">W ∈ ℝ<sup style="font-size:16px">16×9</sup> <span class="c-d">·</span> <span id="pcount">params</span></div>
 <div id="grid" class="abs" style="left:44px;top:106px;width:672px;height:378px">${cellsHtml}</div>
 <div id="lockb" class="abs" style="left:310px;top:225px;width:140px;height:140px;border-radius:28px;background:#0F1114;border:1px solid rgba(76,201,240,.6);
   box-shadow:0 0 0 6px rgba(10,10,11,.7),0 0 30px rgba(76,201,240,.35),0 0 80px rgba(76,201,240,.18)">
   <svg width="140" height="140" viewBox="0 0 140 140"><path d="M48 64 V50 a22 22 0 0 1 44 0 V64" fill="none" stroke="#4CC9F0" stroke-width="8" stroke-linecap="round"/>
   <rect x="38" y="62" width="64" height="50" rx="10" fill="#4CC9F0"/><circle cx="70" cy="82" r="7" fill="#0F1114"/><rect x="66" y="84" width="8" height="14" rx="3" fill="#0F1114"/></svg></div>
 <div id="rg" class="code abs" style="left:44px;top:510px;font-size:32px"></div>
</div>`);
const CELLS=[...model.querySelectorAll('.wc')];
const diff=el(`<div class="panel" style="left:1010px;top:150px;width:620px;height:300px">
 <div class="tb"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="ttl">zsh — diff</span></div>
 <div id="dcode" class="code" style="padding:18px 28px;font-size:27px;line-height:46px"></div></div>`);
const stat=el(`<div class="panel" style="left:1010px;top:476px;width:620px;height:274px;overflow:hidden">
  <div class="abs mono" style="left:30px;top:22px;font-size:24px;color:var(--mu)">// weights changed</div>
  <div class="abs mono" id="zero" style="left:26px;top:52px;font-size:190px;font-weight:700;line-height:1;color:var(--g);letter-spacing:-.04em">0</div>
  <div class="abs mono" style="left:182px;top:96px;font-size:44px;font-weight:700;line-height:1.1">lines<br>changed</div>
  <div class="abs" style="left:182px;top:206px;font-size:30px;color:var(--mu);font-weight:500">一行都没动</div>
</div>`);
// ring + chips
const RING={x:300,y:118,w:1040,h:770,r:28};
const per=2*(RING.w+RING.h)-8*RING.r+2*Math.PI*RING.r;
const ring=el(`<svg class="abs" style="left:0;top:0" width="1920" height="1080">
 <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#3DF5A6"/><stop offset=".5" stop-color="#4CC9F0"/><stop offset="1" stop-color="#3DF5A6"/></linearGradient></defs>
 <rect id="rfill" x="${RING.x}" y="${RING.y}" width="${RING.w}" height="${RING.h}" rx="${RING.r}" fill="rgba(61,245,166,0.025)"/>
 <rect id="rglow" x="${RING.x}" y="${RING.y}" width="${RING.w}" height="${RING.h}" rx="${RING.r}" fill="none" stroke="#3DF5A6" stroke-opacity=".16" stroke-width="12"/>
 <rect id="rline" x="${RING.x}" y="${RING.y}" width="${RING.w}" height="${RING.h}" rx="${RING.r}" fill="none" stroke="url(#lg)" stroke-width="2"/>
 <g id="wires"></g></svg>`);
const ringTab=el(`<div class="abs mono" style="left:${RING.x+28}px;top:${RING.y-22}px;height:44px;padding:0 16px;border-radius:8px;background:#0C1310;border:1px solid rgba(61,245,166,.6);
  font-size:26px;line-height:42px;color:var(--g);box-shadow:0 0 18px rgba(61,245,166,.25)">▸ harness/ <span class="c-mu">· 外层文件</span></div>`);
const ringTab2=el(`<div class="abs mono" style="left:${RING.x+RING.w-360}px;top:${RING.y-22}px;height:44px;padding:0 16px;border-radius:8px;background:#0E0E11;border:1px solid #2C2C33;
  font-size:24px;line-height:42px;color:var(--mu)">weights <span class="c-c">🔒 0 Δ</span> · files <span class="c-g">edited</span></div>`);
const CH=[['提示词','prompt.md',0,300],['护栏','guardrails.md',0,500],['技能','skills/',0,700],['工具说明','tools.md',1,300],['脚本','scripts/',1,500],['记忆','memory.md',1,700]];
const chips=CH.map(([zh,fn,side,cy])=>el(`<div class="chip" style="left:${side?1190:150}px;top:${cy-52}px"><span class="led"></span><div class="zh">${zh}</div><div class="fn">${fn}</div></div>`));
const wires=$('wires');
CH.forEach(([zh,fn,side,cy],k)=>{const x1=side?1190:450,x2=side?1052:588;const ty=lerp(cy,560,.55);
  wires.innerHTML+=`<path id="w${k}" d="M${x1} ${cy} C ${(x1+x2)/2} ${cy}, ${(x1+x2)/2} ${ty}, ${x2} ${ty}" fill="none" stroke="#3DF5A6" stroke-width="2" stroke-opacity=".0"/><circle id="wd${k}" r="5" fill="#3DF5A6"/>`});
const harnessT=el(`<div class="abs" style="left:420px;top:170px;width:800px;text-align:center;white-space:nowrap">
  <span id="hT" class="disp" style="display:inline-block;font-size:150px;letter-spacing:-.05em;line-height:1">${'Harness'.split('').map(c=>`<span style="display:inline-block">${c}</span>`).join('')}</span></div>`);
const HTL=[...$('hT').children];

function scene23(t){
  const on=t>=1.25&&t<5.28;
  [model,diff,stat].forEach(e=>show(e,on?1:0));
  const s3=on&&t>=3.2;
  [ring,ringTab,ringTab2,harnessT,...chips].forEach(e=>show(e,s3?1:0));
  if(!on)return;
  // model panel enter + morph
  const ke=eo(P(t,1.25,.35));
  const km=eio(P(t,3.2,.6));
  const sc=lerp(lerp(.96,1,ke),.58,km);
  const dx=lerp(0,820-580,km),dy=lerp(lerp(18,0,ke),560-450,km);
  model.style.transform=`translate(${dx}px,${dy}px) scale(${sc})`;
  // grid cells
  const lockK=eo(P(t,2.45,.35));

  let h='';for(let i=0;i<5;i++){const y=R2()*1000+60,hh=6+R2()*40,c=R2()<.5?'76,201,240':(R2()<.6?'61,245,166':'255,79,216');
    h+=`<div style="top:${y}px;height:${hh}px;background:rgba(${c},${.16+R2()*.2});transform:translateX(${(R2()-.5)*80}px)"></div>`}
  SL.innerHTML=h;$('flash').style.opacity=fr===0?.10:.04;return(fr===0?18:-10)}

let lastSub=-2;
function drawSub(t){const sp=$('subp');let idx=-1;for(let i=0;i<SUBS.length;i++){const[a,b]=SUBS[i];if(t>=a-0.05&&t<b+0.25)idx=i}
  if(idx<0){sp.style.opacity=0;return}
  const[a]=SUBS[idx];const k=P(t,a-0.05,.18);
  if(idx!==lastSub){sp.innerHTML=`<span class="pr">›</span><span>${fmtSub(SUBS[idx][2])}</span>`;lastSub=idx}
  sp.style.opacity=clamp(k*1.5);sp.style.transform=`translateY(${lerp(10,0,eo(k))}px)`}

window.seek=function(t){

  const c=cam(t);const jx=glitch(t);
  ST.style.transformOrigin=`${c.ox}px ${c.oy}px`;ST.style.transform=`translateX(${jx}px) scale(${c.s})`;
  drawSub(t);
  const f=Math.round(t*30);AV.clearRect(0,0,242,220);AV.drawImage(IM[Math.floor(f*24/30)%242],0,0);
};
